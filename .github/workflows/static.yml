name: Build and deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f package-lock.json ] || [ -f package.json ]; then
            npm ci || npm install
          else
            echo "No package.json found — skipping npm install"
          fi

      - name: Build (if package.json has a build script)
        run: |
          if [ -f package.json ]; then
            if npm run | grep -q " build"; then
              npm run build
            else
              echo "No build script in package.json — skipping build"
            fi
          else
            echo "No package.json — nothing to build"
          fi

      - name: Prepare artifact folder with build output
        run: |
          mkdir -p artifact
          if [ -d build ]; then
            echo "Using ./build as publish folder"
            cp -r build/. artifact/
          elif [ -d dist ]; then
            echo "Using ./dist as publish folder"
            cp -r dist/. artifact/
          elif [ -d public ]; then
            echo "Using ./public as publish folder"
            cp -r public/. artifact/
          elif [ -d docs ]; then
            echo "Using ./docs as publish folder"
            cp -r docs/. artifact/
          else
            echo "No common build output folder found (build/dist/public/docs)."
            echo "If your output folder is different, update .github/workflows/deploy-pages.yml to point to it."
            ls -la
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v3

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v1
        with:
          path: ./artifact

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v1
